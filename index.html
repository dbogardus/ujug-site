<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SALT - Software Aficionados Learning Together</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="description" content="SALT (formerly UJUG) is a non-profit serving the Utah technology community since 1999, with free monthly meetings featuring dinner and technical presentations.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SALT">
  <meta property="og:title" content="SALT - Software Aficionados Learning Together">
  <meta property="og:description" content="SALT (formerly UJUG) is a non-profit serving the Utah technology community since 1999, with free monthly meetings featuring dinner and technical presentations.">
  <meta property="og:url" content="https://salt.us.org/">
  <meta property="og:image" content="https://salt.us.org/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="SALT - Software Aficionados Learning Together">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #2d2d2d;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Logo header */
    .logo-section {
      text-align: center;
      padding: 70px 20px 10px;
    }
    .logo-section img {
      width: 600px;
      max-width: 100%;
      height: auto;
    }
    .group-name {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      color: rgb(255, 112, 57);
      font-size: 1.13em;
      letter-spacing: 3px;
      margin-top: 18px;
    }
    .tagline {
      color: #aaa;
      font-size: 1.1em;
      margin-top: 10px;
      letter-spacing: 0.5px;
    }

    /* Navigation links */
    .nav-links {
      text-align: center;
      padding: 40px 20px 20px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .nav-links a {
      color: rgb(255, 112, 57);
      text-decoration: none;
      font-size: 1em;
      padding: 8px 20px;
      border: 1px solid rgb(255, 112, 57);
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    .nav-links a:hover {
      background-color: rgba(255, 112, 57, 0.15);
    }

    /* Photo grid */
    .photo-grid {
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 20px;
      columns: 3;
      column-gap: 16px;
    }
    .photo-grid img {
      width: 100%;
      display: block;
      margin-bottom: 16px;
      border-radius: 6px;
      opacity: 0;
      transform: translateY(30px) rotate(var(--rotate));
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .photo-grid img.visible {
      opacity: 1;
      transform: translateY(0) rotate(var(--rotate));
    }
    .photo-grid img:hover {
      transform: scale(1.03) rotate(0deg);
      box-shadow: 0 8px 30px rgba(255, 112, 57, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 40px 20px;
      color: #888;
      font-size: 0.9em;
      border-top: 1px solid #444;
      margin-top: 40px;
    }
    .footer a {
      color: rgb(255, 112, 57);
      text-decoration: none;
    }

    /* Sponsors */
    .sponsors {
      text-align: center;
      padding: 80px 20px 10px;
    }
    .sponsors h2 {
      color: #888;
      font-size: 0.9em;
      font-weight: normal;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
    }
    .sponsor-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin-bottom: 25px;
    }
    .sponsor-row img {
      width: auto;
      opacity: 0.7;
      filter: grayscale(100%) brightness(1.8);
      transition: all 0.3s ease;
    }
    .sponsor-row img:hover {
      opacity: 1;
      filter: grayscale(0%) brightness(1);
    }
    .sponsor-row img.dark-hover {
      filter: invert(1) brightness(1.5);
    }
    .sponsor-row img.dark-hover:hover {
      opacity: 1;
      filter: invert(1) brightness(2.5);
    }
    .sponsor-row img.color-hover {
      filter: invert(1) brightness(1.5);
    }
    .sponsor-row img.color-hover:hover {
      opacity: 1;
      filter: invert(1) brightness(2.5);
    }
    .sponsor-row img.bright-hover {
      filter: grayscale(100%) brightness(1.5);
      opacity: 0.7;
      height: 140px !important;
    }
    .sponsor-row img.bright-hover:hover {
      opacity: 1;
      filter: grayscale(0%) brightness(1.2);
    }
    .sponsor-row.tier-diamond img { height: 240px; }
    .sponsor-row.tier-gold img { height: 90px; }
    .sponsor-row.tier-silver img { height: 105px; }
    .sponsor-row img.atono-logo {
      height: 46px;
      filter: grayscale(100%) brightness(2.3);
    }
    .sponsor-row img.atono-logo:hover {
      filter: grayscale(0%) brightness(1.2);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .photo-grid {
        columns: 2;
      }
    }
    @media (max-width: 500px) {
      .photo-grid {
        columns: 1;
      }
      .logo-section img {
        width: 280px;
      }
      .group-name {
        font-size: 0.85em;
        letter-spacing: 2px;
      }
    }
  </style>
</head>
<body>

  <div class="logo-section">
    <img src="salt-logo.png" alt="SALT - Software Aficionados Learning Together">
    <div class="group-name">Software Aficionados Learning Together</div>
    <div class="tagline">SALT (formerly UJUG) is a non-profit serving the Utah technology community since 1999</div>
  </div>

  <nav class="nav-links">
    <a href="https://www.meetup.com/utah-java-users-group/events/" target="_blank">Schedule</a>
    <a href="/sponsorship-info">Sponsorship</a>

  </nav>

  <div class="sponsors">
    <h2>Our Sponsors</h2>
    <div class="sponsor-row tier-diamond">
      <a href="https://www.teksystems.com/" target="_blank"><img src="sponsors/tek-systems-logo.png" alt="TEKsystems" class="dark-hover"></a>
    </div>
    <div class="sponsor-row tier-gold">
      <a href="https://atono.io/" target="_blank"><img src="sponsors/atono-logo.svg" alt="Atono" class="atono-logo"></a>
      <a href="https://stgconsulting.com/" target="_blank"><img src="sponsors/STG_Logo_Blue.png" alt="Software Technology Group" class="dark-hover"></a>
      <a href="https://lucid.co/" target="_blank"><img src="sponsors/LucidLogo1.png" alt="Lucid Software" class="dark-hover"></a>
    </div>
    <div class="sponsor-row tier-silver" style="margin-top: 70px">
      <a href="https://www.octanner.com/solutions/technology" target="_blank"><img src="sponsors/O.C._Tanner_Company_Logo.png" alt="O.C. Tanner" class="color-hover"></a>
      <a href="https://fortififamily.com/" target="_blank"><img src="sponsors/fortify-logo.png" alt="Fortify Financial Services" class="bright-hover"></a>
    </div>
  </div>

  <div class="photo-grid">
    <img src="photos/IMG_0291.jpeg" alt="Speaker presenting on AI" style="--rotate: 1deg">
    <img src="photos/IMG_9188.jpg" alt="Decline and Fall of Microservices talk" style="--rotate: -0.5deg">
    <img src="photos/IMG_0287.jpeg" alt="Speaker presenting to crowd" style="--rotate: 1.5deg">
    <img src="photos/IMG_1875.jpeg" alt="Mastering Software Architecture" style="--rotate: -1deg">
    <img src="photos/IMG_9311.jpeg" alt="SALT meeting" style="--rotate: -1.5deg">
    <img src="photos/IMG_2281.jpeg" alt="Members with O'Reilly book" style="--rotate: 0.5deg">
    <img src="photos/IMG_9183.jpeg" alt="Speaker with mountains backdrop" style="--rotate: -1.5deg">
    <img src="photos/IMG_0806.jpeg" alt="Speaker at podium with code" style="--rotate: 1deg">
    <img src="photos/IMG_6992.jpg" alt="Hardware is Real talk" style="--rotate: -0.5deg">
    <img src="photos/IMG_9332.jpeg" alt="Speaker presenting at a SALT meeting" style="--rotate: 1.5deg">
    <img src="photos/IMG_2383.jpeg" alt="Speaker at podium" style="--rotate: -1deg">
  </div>

  <div class="footer">
    <p>&copy; SALT &mdash; Software Aficionados Learning Together</p>
    <p style="margin-top: 8px"><span id="footer-email"></span></p>
  </div>

  <script>
    // Fade in photos as they scroll into view
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry, i) => {
        if (entry.isIntersecting) {
          setTimeout(() => {
            entry.target.classList.add('visible');
          }, i * 100);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.photo-grid img').forEach(img => {
      observer.observe(img);
    });

    // Assemble email to avoid scrapers
    (function() {
      var u = 'contact';
      var d = 'salt';
      var t = 'us.org';
      var addr = u + '@' + d + '.' + t;
      var cl = document.getElementById('contact-link');
      var fe = document.getElementById('footer-email');
      if (cl) { cl.textContent = addr; }
      if (fe) { fe.textContent = addr; }
    })();
  </script>
</body>
</html>
